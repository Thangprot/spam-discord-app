name: Discord
options:
  bundleIdPrefix: com.quocthang
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.quocthang.discord
    SWIFT_VERSION: "5.0"

targets:
  discord:
    type: application
    platform: iOS
    sources:
      # Đường dẫn chứa code Swift (đảm bảo đúng chữ hoa/thường)
      - path: Sources/discord
      # Đường dẫn chứa Logo
      - path: Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon