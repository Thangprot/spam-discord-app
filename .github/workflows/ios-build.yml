name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  build:
    runs-on: macos-15 # Sử dụng runner macOS 15 mới nhất

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: |
        # Tự động tìm Xcode 16 mới nhất trên máy ảo
        XCODE_PATH=$(ls -d /Applications/Xcode_16*.app | head -n 1)/Contents/Developer
        if [ -d "$XCODE_PATH" ]; then
          echo "Selecting Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
        else
          echo "Xcode 16 not found, using default Xcode version"
        fi
        xcodebuild -version

    - name: Build App (Unsigned)
      run: |
        # Tự động lấy tên scheme từ Package.swift
        SCHEME=$(xcodebuild -list | grep -A100 Schemes | grep -v "Schemes:" | head -n 1 | xargs)
        echo "Detected Scheme: $SCHEME"
        
        # Build app và vô hiệu hóa ký code
        xcodebuild \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath "$RUNNER_TEMP/build" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Package into IPA
      run: |
        # Đóng gói .app thành .ipa
        mkdir -p "$RUNNER_TEMP/Payload"
        APP_PATH=$(find "$RUNNER_TEMP/build/Build/Products/Release-iphoneos" -name "*.app" | head -n 1)
        echo "Copying $APP_PATH"
        cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
        cd "$RUNNER_TEMP" && zip -qry SpamDiscord-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpamDiscord-unsigned-ipa
        path: ${{ runner.temp }}/SpamDiscord-unsigned.ipa
        if-no-files-found: error
        retention-days: 7
