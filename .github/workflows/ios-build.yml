name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust for iOS (DAVE E2EE & Opus)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "DaveFFI -> target"

      - name: Build DaveFFI static library (DAVE E2EE + Opus)
        run: |
          cd DaveFFI
          IPHONEOS_DEPLOYMENT_TARGET=16.0 cargo build --release --target aarch64-apple-ios
          mkdir -p lib
          cp target/aarch64-apple-ios/release/libdave_ffi.a lib/libdave_ffi.a
          ls -lh lib/libdave_ffi.a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild build \
          -project Discord.xcodeproj \
          -scheme Discord \
          -configuration Release \
          -sdk iphoneos \
          -destination generic/platform=iOS \
          -derivedDataPath /Users/runner/work/_temp/build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          mv /Users/runner/work/_temp/build/Build/Products/Release-iphoneos/Discord.app Payload/
          python3 - <<'PY'
          import hashlib, subprocess, re
          bin_path = "Payload/Discord.app/Discord"
          out = subprocess.check_output(["otool", "-l", bin_path], text=True)
          blocks = out.split("Section")
          for b in blocks:
              if "sectname __text" in b and "segname __TEXT" in b:
                  m_off = re.search(r"offset\s+(\d+)", b)
                  m_sz = re.search(r"size\s+0x([0-9a-fA-F]+)", b)
                  if m_off and m_sz:
                      off = int(m_off.group(1))
                      sz = int(m_sz.group(1), 16)
                      with open(bin_path, "rb") as f:
                          f.seek(off)
                          data = f.read(sz)
                      print("====================================================")
                      print("ANTI-TAMPER BINARY __TEXT SHA-256:", hashlib.sha256(data).hexdigest())
                      print("====================================================")
                      break
          PY
          zip -r Discord.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Discord-IPA
          path: Discord.ipa
