name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  build:
    runs-on: macos-14 # Sử dụng runner macOS với Xcode 15+

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Generate Xcode Project from Swift Package
      run: |
        # Tạo một dự án Xcode tạm thời từ Package.swift
        swift package generate-xcodeproj

    - name: Build App (Unsigned)
      run: |
        # Build ứng dụng với các cờ vô hiệu hóa ký code
        xcodebuild -project SpamDiscord.xcodeproj \
          -scheme SpamDiscord \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath "$RUNNER_TEMP/build" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Package into IPA
      run: |
        # Đóng gói file .app thành .ipa
        mkdir -p "$RUNNER_TEMP/Payload"
        cp -R "$RUNNER_TEMP/build/Build/Products/Release-iphoneos/SpamDiscord.app" "$RUNNER_TEMP/Payload/"
        cd "$RUNNER_TEMP" && zip -qry SpamDiscord-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpamDiscord-unsigned-ipa
        path: ${{ runner.temp }}/SpamDiscord-unsigned.ipa
        if-no-files-found: error
        retention-days: 7