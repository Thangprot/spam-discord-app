name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild build \
          -project Discord.xcodeproj \
          -scheme discord \
          -configuration Release \
          -sdk iphoneos \
          -destination generic/platform=iOS \
          -derivedDataPath /Users/runner/work/_temp/build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          mv /Users/runner/work/_temp/build/Build/Products/Release-iphoneos/Discord.app Payload/
          zip -r Discord.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Discord-IPA
          path: Discord.ipa